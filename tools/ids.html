<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurvivalGate ids</title>
<style>
  body { font-family: Georgia, serif; background: #f4efe4; color: #1f2a37; max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  input, textarea { width: 100%; font: inherit; padding: 6px 8px; box-sizing: border-box; margin: 4px 0 12px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 0.85em; word-break: break-all; }
  table { border-collapse: collapse; width: 100%; } td { border-bottom: 1px solid #d9cfbd; padding: 6px 4px; vertical-align: top; }
</style>
</head>
<body>
<h1>SurvivalGate ids</h1>
<p>Offline helper: computes the agreement id and clause ids exactly like the contract (Keccak-256,
Python whitespace rules). Nothing is sent anywhere.</p>
<label>Author wallet<input id="author" spellcheck="false"></label>
<label>Other side wallet<input id="other" spellcheck="false"></label>
<label>Clause texts, one per line<textarea id="texts" rows="6"></textarea></label>
<p>Agreement id: <code id="aid">—</code></p>
<table id="out"></table>
<script id="core">
// ---- Keccak-256 (Ethereum padding 0x01), BigInt lanes ----
const RC = [
  0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
  0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
  0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
  0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
  0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
  0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n,
];
const ROT = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];
const M = (1n << 64n) - 1n;
const rotl = (x, n) => (n === 0 ? x : ((x << BigInt(n)) | (x >> BigInt(64 - n))) & M);
function keccakF(s) {
  for (let r = 0; r < 24; r++) {
    const C = [0, 1, 2, 3, 4].map((x) => s[x] ^ s[x + 5] ^ s[x + 10] ^ s[x + 15] ^ s[x + 20]);
    for (let x = 0; x < 5; x++) {
      const D = C[(x + 4) % 5] ^ rotl(C[(x + 1) % 5], 1);
      for (let y = 0; y < 25; y += 5) s[x + y] ^= D;
    }
    const B = new Array(25);
    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) B[y + 5 * ((2 * x + 3 * y) % 5)] = rotl(s[x + 5 * y], ROT[x + 5 * y]);
    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) s[x + 5 * y] = B[x + 5 * y] ^ (~B[(x + 1) % 5 + 5 * y] & M & B[(x + 2) % 5 + 5 * y]);
    s[0] ^= RC[r];
  }
}
function keccak256Hex(bytes) {
  const rate = 136;
  const padded = new Uint8Array(Math.ceil((bytes.length + 1) / rate) * rate);
  padded.set(bytes);
  padded[bytes.length] ^= 0x01;
  padded[padded.length - 1] ^= 0x80;
  const s = new Array(25).fill(0n);
  for (let off = 0; off < padded.length; off += rate) {
    for (let i = 0; i < rate / 8; i++) {
      let lane = 0n;
      for (let b = 7; b >= 0; b--) lane = (lane << 8n) | BigInt(padded[off + i * 8 + b]);
      s[i] ^= lane;
    }
    keccakF(s);
  }
  let hex = "";
  for (let i = 0; i < 4; i++) for (let b = 0; b < 8; b++) hex += Number((s[i] >> BigInt(8 * b)) & 0xffn).toString(16).padStart(2, "0");
  return hex;
}
// ---- Python str.strip() / split() / len() ----
const WS = new Set([0x09,0x0a,0x0b,0x0c,0x0d,0x1c,0x1d,0x1e,0x1f,0x20,0x85,0xa0,0x1680,0x2000,0x2001,0x2002,0x2003,0x2004,0x2005,0x2006,0x2007,0x2008,0x2009,0x200a,0x2028,0x2029,0x202f,0x205f,0x3000]);
const isWs = (c) => WS.has(c.codePointAt(0));
function pyNormalize(t) { const out = []; let cur = ""; for (const c of Array.from(t)) { if (isWs(c)) { if (cur) out.push(cur); cur = ""; } else cur += c; } if (cur) out.push(cur); return out.join(" "); }
const utf8 = (s) => new TextEncoder().encode(s);
function agreementId(author, other) { return keccak256Hex(utf8("SURVIVAL_GATE:AGREEMENT:V1|" + author.trim().toLowerCase() + "|" + other.trim().toLowerCase())); }
function clauseId(aid, text) { const n = pyNormalize(text); return keccak256Hex(utf8("SURVIVAL_GATE:CLAUSE:V1|" + aid + "|" + Array.from(n).length + "|" + n)); }
</script>
<script>
const $ = (id) => document.getElementById(id);
const DEFAULT = [
  "Nothing in the closing of this arrangement releases either party from what is already owed.",
  "Once we close, neither party owes the other anything further.",
  "We remain answerable for anything done while the work was live.",
  "The exclusivity applies only while the work is live.",
  "The audit rights outlast the engagement itself.",
].join("\n");
$("texts").value = DEFAULT;
const ok = (w) => /^0x[0-9a-f]{40}$/.test(w.trim().toLowerCase());
function render() {
  const a = $("author").value, o = $("other").value;
  if (!ok(a) || !ok(o)) { $("aid").textContent = "enter two wallets"; $("out").innerHTML = ""; return; }
  const aid = agreementId(a, o);
  $("aid").textContent = aid;
  const table = $("out"); table.textContent = "";
  for (const line of $("texts").value.split("\n")) {
    if (!pyNormalize(line)) continue;
    const tr = table.insertRow(); tr.insertCell().textContent = line; const td = tr.insertCell();
    const code = document.createElement("code"); code.textContent = clauseId(aid, line); td.appendChild(code);
  }
}
["author", "other", "texts"].forEach((id) => $(id).addEventListener("input", render));
</script>
</body>
</html>
